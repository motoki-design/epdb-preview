var ITER = 310000;
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer;}
async function unlock(pw){
  var keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:ITER, hash:'SHA-256'},
    keyMat, {name:'AES-GCM', length:256}, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  var html = new TextDecoder().decode(plain);
  sessionStorage.setItem('epdb_pw', pw);
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  var btn=document.getElementById('btn'), err=document.getElementById('err');
  btn.disabled=true; err.style.display='none';
  unlock(document.getElementById('pw').value).catch(function(){
    btn.disabled=false; err.style.display='block';
  });
});
// 同一タブ内の再訪はパスワード再入力不要
(function(){var p=sessionStorage.getItem('epdb_pw'); if(p){unlock(p).catch(function(){sessionStorage.removeItem('epdb_pw');});}})();
